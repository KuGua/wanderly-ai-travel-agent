<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travel Together — 我的旅行地图</title><style>
:root{--nav:#082c3b;--sea:#0e3e51;--land:#b9d9ca;--white:#fffefa;--orange:#de6b31;--blue:#087a91;--green:#24715d;--gold:#bd8618;--line:#d4dfda}*{box-sizing:border-box}body{margin:0;color:#102534;font:16px/1.5 system-ui,"Microsoft YaHei",sans-serif;background:var(--sea)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:3px}.skip{position:absolute;top:-4rem;left:1rem}.skip:focus{top:1rem;z-index:30;background:white;padding:.6rem}.rail{position:fixed;inset:0 auto 0 0;z-index:5;display:flex;flex-direction:column;width:220px;padding:24px 14px;background:var(--nav);color:#d9f0eb;border-right:1px solid #ffffff30}.brand{display:flex;align-items:center;gap:.7rem;color:white;text-decoration:none;font-weight:800}.orb{display:grid;place-items:center;width:30px;height:30px;border:1px solid #8fd1c4;border-radius:50%;font-size:.72rem}.nav{display:grid;gap:4px;margin-top:34px}.nav a{min-height:44px;padding:.65rem .8rem;border-radius:8px;color:#b8d5d0;text-decoration:none}.nav a[aria-current],.nav a:hover{background:#ffffff18;color:#fff}.user{display:flex;gap:.6rem;align-items:center;margin-top:auto;padding:15px 7px 0;border-top:1px solid #ffffff22}.avatar{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#e9a170;color:#552e13;font-weight:800}.user small{display:block;color:#9ac4bd}.map{min-height:100dvh;margin-left:220px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 56% 44%,#e9f5ef 0 18%,#c7e5d9 41%,#72a8a2 100%)}.map:before{content:"";position:absolute;inset:0;opacity:.35;background:repeating-linear-gradient(0deg,transparent 0 13.8%,#0b516040 14% 14.15%),repeating-linear-gradient(90deg,transparent 0 16.5%,#0b516040 16.65% 16.8%)}.land{position:absolute;z-index:0;background:var(--land);border:1px solid #568f8c80;filter:drop-shadow(0 11px 8px #174c4a36)}.a{width:30%;height:51%;left:13%;top:20%;border-radius:50% 45% 58% 35%/45% 48% 50% 55%;transform:rotate(-12deg)}.b{width:31%;height:38%;left:46%;top:19%;border-radius:40% 65% 45% 60%/55% 35% 65% 45%;transform:rotate(13deg)}.c{width:14%;height:36%;left:38%;top:51%;border-radius:38% 62% 50% 45%;transform:rotate(20deg)}.top{position:absolute;z-index:2;top:22px;left:28px;right:28px;display:flex;gap:12px}.ask{display:flex;align-items:center;gap:.6rem;flex:1;max-width:620px;min-height:52px;padding:0 16px;border:1px solid #fff9;border-radius:14px;background:#082c3be6;color:#fff}.ask b{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--orange);font-size:.7rem}.ask input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:white}.ask input::placeholder{color:#c4dfda}.tool{min-height:44px;padding:.5rem .8rem;border:1px solid #ffffffaa;border-radius:10px;background:#082c3be6;color:white}.filters{position:absolute;z-index:2;top:92px;left:28px;display:flex;flex-wrap:wrap;gap:8px}.filter{min-height:38px;padding:.4rem .7rem;border:1px solid #ffffffaa;border-radius:999px;background:#082c3bd9;color:#fff}.filter[aria-pressed="true"]{background:#fff;color:#123544}.pin{position:absolute;z-index:2;display:grid;place-items:center;width:46px;height:46px;border:3px solid #fff;border-radius:50% 50% 50% 8px;background:var(--pin);color:white;box-shadow:0 8px 16px #123b4266;transform:rotate(-45deg);transition:.18s}.pin:hover{transform:rotate(-45deg) translate(-3px,-3px)}.pin span{transform:rotate(45deg);font-size:.7rem;font-weight:900}.recommend{--pin:var(--blue)}.trending{--pin:var(--orange)}.planning{--pin:var(--gold)}.visited{--pin:var(--green)}.l1{left:45%;top:45%}.l2{left:58%;top:30%}.l3{left:73%;top:47%}.l4{left:76%;top:60%}.l5{left:32%;top:54%}.pin[data-hidden="true"]{display:none}.route{position:absolute;z-index:1;left:34%;top:43%;width:39%;height:24%;border-top:2px dashed #c27622;transform:rotate(-3deg);border-radius:50%}.alert{position:absolute;z-index:3;left:28px;bottom:30px;width:min(480px,calc(100% - 56px));padding:18px;border:1px solid white;border-radius:15px;background:#fffefaf2;box-shadow:0 14px 38px #07364824}.signal{display:flex;justify-content:space-between;gap:1rem}.signal small{color:#6c7472;font-weight:800}.signal h1{margin:.2rem 0;font-size:1.25rem;line-height:1.25}.signal p{margin:0;color:#52666a;font-size:.9rem}.close{width:36px;height:36px;border:1px solid var(--line);border-radius:9px;background:white}.actions{display:flex;gap:8px;margin-top:14px}.button{min-height:42px;padding:.55rem .75rem;border:1px solid transparent;border-radius:9px;font-weight:750}.primary{background:var(--orange);color:white}.secondary{background:white;border-color:var(--line);color:#183b45}.controls{position:absolute;z-index:2;right:28px;bottom:30px;display:grid;gap:8px}.control{display:grid;place-items:center;width:44px;height:44px;border:1px solid white;border-radius:11px;background:#082c3be6;color:white;font-size:1.2rem}.legend{position:absolute;z-index:2;right:28px;bottom:190px;padding:12px;border:1px solid #fff9;border-radius:12px;background:#082c3be6;color:white;font-size:.78rem}.legend div{display:flex;gap:7px;margin:5px 0}.legend i{width:9px;height:9px;border-radius:50%;background:var(--dot)}.drawer{position:absolute;z-index:4;top:0;right:0;width:min(420px,100%);height:100%;padding:28px;background:#fffefa;box-shadow:-16px 0 50px #072a3333;transform:translateX(102%);transition:transform .25s}.drawer.open{transform:translateX(0)}.drawer-top{display:flex;justify-content:space-between}.drawer h2{margin:.5rem 0;font-size:2rem}.drawer p{color:#53666a}.badge{display:inline-flex;padding:.25rem .5rem;border-radius:999px;background:#e5f3f0;color:#075f70;font-size:.78rem;font-weight:800}.reason{margin:20px 0;padding:14px;border-radius:11px;background:#eef5f2}.toast{position:fixed;right:20px;bottom:20px;z-index:20;max-width:330px;padding:12px;border-radius:10px;background:white;color:#102534;box-shadow:0 14px 38px #07364824;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(max-width:760px){.rail{position:sticky;top:0;flex-direction:row;align-items:center;width:auto;height:62px;padding:0 14px;border-right:0}.nav{display:none}.user{margin:0 0 0 auto;padding:0;border:0}.user>span:nth-child(2){display:none}.map{margin-left:0;min-height:calc(100dvh - 62px)}.top{top:14px;left:14px;right:14px}.tool{display:none}.filters{top:77px;left:14px;right:14px}.alert{left:14px;bottom:18px;width:calc(100% - 28px)}.legend{display:none}.controls{right:14px;bottom:230px}.l1{left:40%;top:43%}.l2{left:62%;top:28%}.l3{left:74%;top:49%}.l4{left:72%;top:64%}.l5{left:25%;top:55%}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.map{touch-action:manipulation}.explore-marker{position:absolute;z-index:3;width:30px;height:30px;border:3px solid white;border-radius:50%;background:var(--orange);box-shadow:0 0 0 8px #de6b3140;transform:translate(-50%,-50%);pointer-events:none}
</style></head><body>
<a class="skip" href="#main">跳至地图主内容</a><aside class="rail"><a class="brand" href="#"><span class="orb">TT</span>Travel Together</a><nav class="nav" aria-label="主导航"><a href="#" aria-current="page">我的地图</a><a href="#agent-alert">Agent 简报</a><a href="#">协同行程</a><a href="#">旅行记忆</a></nav><div class="user"><span class="avatar">A</span><span>Alice<small>探索者等级 4</small></span></div></aside>
<main class="map" id="main"><span class="land a"></span><span class="land b"></span><span class="land c"></span><span class="route"></span><div class="top"><label class="ask"><b>AI</b><input aria-label="询问旅行 Agent" placeholder="问问你的旅行 Agent：想去哪？"></label><button class="tool" data-toast="通知中心仅为静态原型。">通知</button><button class="tool" data-toast="地图回到你的旅行世界。">我的世界</button></div><div class="filters" role="group" aria-label="地点筛选"><button class="filter" data-filter="all" aria-pressed="true">全部</button><button class="filter" data-filter="recommend" aria-pressed="true">为你推荐</button><button class="filter" data-filter="trending" aria-pressed="true">热门目的地</button><button class="filter" data-filter="planning" aria-pressed="true">规划中</button><button class="filter" data-filter="visited" aria-pressed="true">我的足迹</button></div>
<button class="pin recommend l1" data-kind="recommend" data-title="里斯本" data-tag="为你推荐" data-reason="艺术街区、步行友好与城市中心住宿，符合你保存的私密偏好。"><span>里斯本</span></button><button class="pin recommend l2" data-kind="recommend" data-title="哥本哈根" data-tag="为你推荐" data-reason="适合节奏舒缓、设计感强的城市探索。"><span>哥本哈根</span></button><button class="pin trending l3" data-kind="trending" data-title="大阪" data-tag="热门目的地" data-reason="本月精选的城市美食与夜间文化目的地。数据为演示 fixture。"><span>大阪</span></button><button class="pin visited l4" data-kind="visited" data-title="京都" data-tag="我的足迹" data-reason="你保存的历史旅行地点；默认仅对你可见。"><span>京都</span></button><button class="pin planning l5" data-kind="planning" data-title="里斯本方案 v2" data-tag="规划中" data-reason="Agent 已在价格变化后重建方案，等待你的复核。"><span>v2</span></button>
<section class="alert" id="agent-alert" aria-labelledby="alert-title"><div class="signal"><div><small>AGENT SIGNAL · 01</small><h1 id="alert-title">里斯本价格上涨，我已重建方案 v2</h1><p>保留已授权偏好，重新协调机票、住宿与地面交通。</p></div><button class="close" aria-label="隐藏 Agent 提示" id="hide-alert">×</button></div><div class="actions"><button class="button primary" data-toast="原型操作：将进入方案 v2 差异对比。">复核方案 v2</button><button class="button secondary" data-toast="原型操作：将展示授权约束与来源。">查看依据</button></div></section>
<aside class="legend" aria-label="地图图例"><div><i style="--dot:#087a91"></i>为你推荐</div><div><i style="--dot:#de6b31"></i>热门目的地</div><div><i style="--dot:#bd8618"></i>规划中</div><div><i style="--dot:#24715d"></i>我的足迹</div><div style="margin-top:8px;color:#b9d8d1">DEMO DATA</div></aside><div class="controls"><button class="control" aria-label="放大地图">+</button><button class="control" aria-label="缩小地图">−</button><button class="control" aria-label="回到当前位置">◎</button></div>
<aside class="drawer" id="drawer" aria-labelledby="drawer-title"><div class="drawer-top"><div><span class="badge" id="drawer-tag">为你推荐</span><h2 id="drawer-title">里斯本</h2></div><button class="close" aria-label="关闭地点档案" id="close-drawer">×</button></div><p>地点档案为静态示意，不代表实时库存、价格或入境结论。</p><div class="reason"><strong>Agent 为什么把它放在这里</strong><br><span id="drawer-reason"></span></div><button class="button primary" data-toast="原型操作：将围绕该目的地开始规划。">围绕此地规划</button></aside></main><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const pins=[...document.querySelectorAll('.pin')],filters=[...document.querySelectorAll('.filter')],drawer=document.querySelector('#drawer'),toast=document.querySelector('#toast'),kinds=['recommend','trending','planning','visited'];let timer;function say(m){toast.textContent=m;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(function(){toast.classList.remove('show')},3000)}function q(f){return document.querySelector('[data-filter="'+f+'"]')}function sync(){const active=kinds.filter(function(k){return q(k).getAttribute('aria-pressed')==='true'});pins.forEach(function(p){p.dataset.hidden=!active.includes(p.dataset.kind)});q('all').setAttribute('aria-pressed',active.length===kinds.length)}filters.forEach(function(f){f.addEventListener('click',function(){const k=f.dataset.filter;if(k==='all'){const n=f.getAttribute('aria-pressed')!=='true';kinds.forEach(function(x){q(x).setAttribute('aria-pressed',n)})}else f.setAttribute('aria-pressed',f.getAttribute('aria-pressed')!=='true');sync()})});pins.forEach(function(p){p.addEventListener('click',function(){document.querySelector('#drawer-title').textContent=p.dataset.title;document.querySelector('#drawer-tag').textContent=p.dataset.tag;document.querySelector('#drawer-reason').textContent=p.dataset.reason;drawer.classList.add('open');document.querySelector('#close-drawer').focus()})});document.querySelector('#close-drawer').onclick=function(){drawer.classList.remove('open')};document.querySelector('#hide-alert').onclick=function(e){e.currentTarget.closest('.alert').hidden=true};document.querySelectorAll('[data-toast]').forEach(function(b){b.addEventListener('click',function(){say(b.dataset.toast)})});
let exploreMarker;const mapSurface=document.querySelector('#main');function openExploration(event){if(event.target.closest('button,input,.alert,.drawer,.filters,.top,.controls,.legend'))return;const bounds=mapSurface.getBoundingClientRect();if(!exploreMarker){exploreMarker=document.createElement('span');exploreMarker.className='explore-marker';exploreMarker.setAttribute('aria-hidden','true');mapSurface.append(exploreMarker)}exploreMarker.style.left=(event.clientX-bounds.left)+'px';exploreMarker.style.top=(event.clientY-bounds.top)+'px';document.querySelector('#drawer-title').textContent='探索标记';document.querySelector('#drawer-tag').textContent='尚无候选数据';drawer.querySelector('p').textContent='你已在地图上标记一个感兴趣的区域。当前 MVP 仅提供预置候选的可验证资料，因此不会为任意坐标编造地点、价格或入境信息。';document.querySelector('#drawer-reason').textContent='可将此标记保存为仅自己可见的旅行灵感，或在后续规划中请求将附近地区加入候选。';drawer.querySelector('.primary').textContent='保存为私有灵感';drawer.querySelector('.primary').dataset.toast='原型操作：探索标记已保存为仅 Alice 可见的旅行灵感。';drawer.classList.add('open');document.querySelector('#close-drawer').focus()}mapSurface.addEventListener('click',openExploration);
</script></body></html>
