apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    access: proxy
    uid: tempo
    orgId: 1
    # Grafana queries Tempo over its HTTP server, not the OTLP ingestion port.
    url: http://tempo:3100
    isDefault: true
    editable: false
    jsonData:
      httpMethod: GET
      tracesToLogsV2:
        # Local dev: log lines are read via `docker logs`, not via a Loki
        # datasource. The dashboard's "Logs by trace_id" panel documents the
        # exact shell snippet so engineers can grep the trace_id out of the
        # API container's pino stdout.
        datasourceUid: ""
        customQuery: false
        spanStartTimeShift: ""
        spanEndTimeShift: ""
        filters: []
      serviceMap:
        datasourceUid: ""
      nodeGraph:
        enabled: true

  # Scrapes the API and Worker registries so the dashboard can render metrics
  # instead of documenting `curl /metrics`. Local development only — see
  # observability/prometheus.yml.
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    orgId: 1
    url: http://prometheus:9090
    isDefault: false
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
