services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: travelagent
      POSTGRES_PASSWORD: travelagent
      POSTGRES_DB: travelagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelagent"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: travelagent
      DB_PASSWORD: travelagent
      DB_NAME: travelagent
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
