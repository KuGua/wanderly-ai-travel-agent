services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: travelagent
      POSTGRES_PASSWORD: travelagent
      POSTGRES_DB: travelagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelagent"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    # Default `docker compose up -d` starts only postgres. The API container
    # is gated by the `full` profile so dev can opt in to the full stack
    # with `docker compose --profile full up -d`.
    profiles: ["full"]
    # Local-only runtime configuration. Secrets remain in the Git-ignored
    # apps/api/.env file; explicit values below deliberately override Docker
    # networking and observability settings.
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: travelagent
      DB_PASSWORD: travelagent
      DB_NAME: travelagent
      # This is the local development stack. It intentionally supports the
      # loopback-only custom-local auth mode documented in .env.example.
      NODE_ENV: development
      HOST: 0.0.0.0
      LOCAL_DEV_CONTAINER: "true"
      # Lightweight default: safe local NDJSON logs are on; trace export is
      # off. docker-compose.observability.yml overrides these only when that
      # optional file is included explicitly.
      OTEL_SERVICE_NAME: ai-travel-agent-api
      OTEL_SDK_DISABLED: "true"
      OTEL_TRACES_EXPORTER: none
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      LOCAL_DEBUG_LOG_FILE: ${API_LOCAL_DEBUG_LOG_FILE:-api-runtime.ndjson}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./runtime:/app/apps/api/runtime

  worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    # The worker shares the `full` profile with the API.
    profiles: ["full"]
    command: ["node", "dist/workers/worker-main.js"]
    # Keep the Worker on the same local configuration contract as the API so
    # it can execute accepted Agent tasks with the configured model/provider.
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: travelagent
      DB_PASSWORD: travelagent
      DB_NAME: travelagent
      NODE_ENV: development
      OTEL_SERVICE_NAME: ai-travel-agent-worker
      OTEL_SDK_DISABLED: "true"
      OTEL_TRACES_EXPORTER: none
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      # Use a distinct filename from the API process: two processes must not
      # concurrently append to the same NDJSON diagnostic file.
      LOCAL_DEBUG_LOG_FILE: ${WORKER_LOCAL_DEBUG_LOG_FILE:-worker-runtime.ndjson}
      # The worker never calls the resolver. Force `disabled` mode so even
      # if the in-process fallback path is reached, no 70 MB GeoJSON gets
      # loaded into this container.
      LOCATION_REFERENCE_MODE: disabled
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - ./runtime:/app/apps/api/runtime

  location-reference:
    # Dev-only sidecar for the ~70 MB GeoJSON resolver. Off by default
    # (lives behind the `location-reference` profile). The API reaches it
    # via `LOCATION_REFERENCE_MODE=sidecar LOCATION_REFERENCE_SIDECAR_URL=...`.
    # See `apps/api/src/location-reference/SIDECAR.md` for the contract and
    # threat model. Bound to loopback only; never publish or expose publicly.
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ["node", "--max-old-space-size=512", "dist/location-reference/sidecar-main.js"]
    environment:
      PORT: 3002
      HOST: 127.0.0.1
      NODE_ENV: production
    ports:
      - "127.0.0.1:3002:3002"
    mem_limit: 768m
    mem_reservation: 384m
    profiles: ["location-reference"]

volumes:
  pgdata:
