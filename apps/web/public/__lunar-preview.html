<!doctype html><meta charset="utf-8"><title>lunar preview</title>
<style>
  body{margin:0;background:#0b1016;font:12px system-ui;color:#bfc7d2}
  .frame{position:relative;height:60vh;overflow:hidden;border-bottom:1px solid #222}
  .moon{position:absolute;inset:auto 0 0 0;height:24vh;
    background:url("/images/lunar-horizon.svg") center top / 100% 100% no-repeat;}
  .label{position:absolute;top:8px;left:12px;z-index:2}
  .narrow{width:390px;border-right:1px solid #333}
</style>
<div class="frame"><span class="label">desktop width</span><div class="moon"></div></div>
<div class="frame narrow"><span class="label">390px</span><div class="moon"></div></div>
