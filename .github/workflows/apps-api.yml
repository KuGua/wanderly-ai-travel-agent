name: apps-api

on:
  push:
    branches: [develop, feat/**, fix/**]
    paths:
      - "apps/api/**"
      - ".github/workflows/apps-api.yml"
  pull_request:
    branches: [develop]
    paths:
      - "apps/api/**"
      - ".github/workflows/apps-api.yml"

# Match `develop` (the AI integration target) and short-lived feature/fix
# branches created from it. `main` is human-controlled per AGENTS.md.

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: travelagent
          POSTGRES_PASSWORD: travelagent
          POSTGRES_DB: travelagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travelagent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: travelagent
      DB_PASSWORD: travelagent
      DB_NAME: travelagent
      COGNITO_USER_POOL_ID: us-east-1_example
      COGNITO_CLIENT_ID: example-public-app-client-id
      SANDBOX_HMAC_SECRET: replace-with-a-local-random-secret-at-least-32-bytes
      LOG_LEVEL: warn
      NPM_CONFIG_AUDIT: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Docs verify (doc ↔ source-of-truth)
        run: npm run docs:verify

      - name: Apply migrations
        run: npm run db:migrate

      - name: Tests
        run: npm test
